   <g id="text_58">
    <text style="font-size: 9.25px; font-family: 'DejaVu Serif'; text-anchor: start" x="57.42" y="354.8088" transform="rotate(-0 57.42 354.8088)">Threshold-specific measurements classify Attack when 1 - P(Normal) is at least the stated threshold. Counts refer to network-flow records.</text>
   </g>
   <g id="text_59">
    <text style="font-size: 9.25px; font-family: 'DejaVu Serif'; text-anchor: start" x="57.42" y="368.5302" transform="rotate(-0 57.42 368.5302)">UNSW-NB15 development validation: 35,167 records (23,976 Attack; 11,191 Normal). Scores were reproduced from the saved XGBoost V1 classifier.</text>
   </g>
   <g id="text_60">
    <text style="font-size: 9.2px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #565656" x="57.42" y="382.2516" transform="rotate(-0 57.42 382.2516)">Development validation was repeatedly examined; the results do not estimate independent TEST-set performance or real-world deployment reliability.</text>
