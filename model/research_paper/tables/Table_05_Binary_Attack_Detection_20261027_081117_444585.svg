   <g id="text_57">
    <text style="font-size: 9.25px; font-family: 'DejaVu Serif'; text-anchor: start" x="57.42" y="341.0874" transform="rotate(-0 57.42 341.0874)">Notes: AP = average precision; ROC-AUC = area under the ROC curve; ECE = expected calibration error; FPR = false-positive rate.</text>
