   <g id="text_74">
    <text style="font-size: 9.1px; font-family: 'DejaVu Serif'; text-anchor: start" x="58.7592" y="337.533696" transform="rotate(-0 58.7592 337.533696)">Notes: AP = average precision; MAE = mean absolute error; NLL = negative log-likelihood. Bold indicates the better of the two models within each dataset.</text>
   </g>
   <g id="text_75">
    <text style="font-size: 9.1px; font-family: 'DejaVu Serif'; text-anchor: start" x="58.7592" y="352.280736" transform="rotate(-0 58.7592 352.280736)">The event-window column counts true future-event windows; pooled horizon AP is evaluated over 18,839 aligned decision windows.</text>
   </g>
   <g id="text_76">
    <text style="font-size: 9.1px; font-family: 'DejaVu Serif'; text-anchor: start" x="58.7592" y="367.027776" transform="rotate(-0 58.7592 367.027776)">Future attack-family and ETA metrics are conditional on a true future event. Source-specific support differs and some attack families are absent in individual sources.</text>
